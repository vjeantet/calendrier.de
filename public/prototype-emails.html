<!DOCTYPE html>
<!--
PROTOTYPE JETABLE : texte des trois emails du partage.
Ticket : .scratch/partage/issues/14-texte-emails.md
Ne doit jamais arriver sur master.

  outils/captures/serveur.py 8000
  http://127.0.0.1:8000/prototype-emails.html?variant=A&cas=creation

Trois variantes (?variant=A|B|C) × cinq cas (?cas=…). Chaque email est montré
comme dans une messagerie : en-têtes (De, À, Objet), puis le rendu HTML ou le
texte brut, en largeur ordinateur ou téléphone.

A « Texte seul »   : text/plain uniquement, liens nus sur leur propre ligne,
                     titre hors de l'objet.
B « Bouton + encadré » : HTML + texte, un gros bouton pour le lien de gestion,
                     le lien public dans un encadré « À transmettre », titre
                     dans l'objet.
C « Un seul lien » : HTML + texte, très court ; l'email ne porte QUE le lien
                     de gestion. Le lien public n'est jamais envoyé : il
                     s'affiche dans le bandeau une fois le partage activé.
-->

				t.push('');
			});
			h += '</ul><p style="margin:0 0 14px;">Ces liens sont neufs. Celui que vous utilisez remplace l\'ancien : les autres navigateurs perdent alors le droit de publier. Ils expirent le vendredi 13 novembre à 17 h 48 s\'ils ne sont pas utilisés.</p>' +
				'<p style="margin:0;font-size:13px;color:#555;">Vous n\'avez rien demandé ? Ignorez cet email : vos liens actuels restent valables.</p>';
			t = t.concat(['Ces liens sont neufs. Celui que vous utilisez remplace l\'ancien :',
				'les autres navigateurs perdent alors le droit de publier.', '',
				'Vous n\'avez rien demandé ? Ignorez cet email : vos liens actuels',
				'restent valables.', '', '-- ', DOMAINE + ' · Données personnelles : ' + DONNEES]);
		} else {
			r.objet = 'Aucun calendrier partagé avec cette adresse';
			h = '<p style="margin:0 0 14px;">Aucun calendrier partagé n\'est rattaché à cette adresse. Il a peut-être été partagé avec une autre adresse, arrêté, ou supprimé faute d\'activation ou d\'activité.</p>' +
				'<p style="margin:0 0 14px;">Vos annotations restent dans votre navigateur : <a href="' + BASE + '" style="color:#2960ae;">' + DOMAINE + '</a></p>' +
				'<p style="margin:0;font-size:13px;color:#555;">Vous n\'avez rien demandé ? Ignorez cet email.</p>';
			t = ['Aucun calendrier partagé n\'est rattaché à cette adresse. Il a',
				'peut-être été partagé avec une autre adresse, arrêté, ou supprimé',
				'faute d\'activation ou d\'activité.', '',
				'Vos annotations restent dans votre navigateur : ' + BASE, '',
				'Vous n\'avez rien demandé ? Ignorez cet email.', '',
				'-- ', DOMAINE + ' · Données personnelles : ' + DONNEES];
		}
		r.html = cadreC(h);
		r.texte = t.join('\n');
		return r;
	}

	// ---------- affichage ----------

	var VARIANTES = { A: ['Texte seul', varianteA], B: ['Bouton + encadré', varianteB], C: ['Un seul lien', varianteC] };
	var variante = VARIANTES[P.get('variant')] ? P.get('variant') : 'A';
	var casId = CAS.some(function (x) { return x[0] === P.get('cas'); }) ? P.get('cas') : 'creation';
	var cas = CAS.filter(function (x) { return x[0] === casId; })[0];
	var mail = VARIANTES[variante][1](cas[2]);
	var vue = mail.html ? (P.get('vue') || 'html') : 'texte';
	var telephone = P.get('ecran') === 'telephone';

	function aller(cle, val) {
		P.set(cle, val);
		location.search = P.toString();
	}

	document.getElementById('client').classList.toggle('telephone', telephone);
	document.getElementById('entetes').innerHTML =
		'<div class="objet">' + esc(mail.objet) + '</div>' +
		'<div class="exp"><span class="lbl">De</span><b>' + esc(mail.nom) + '</b> &lt;' + esc(mail.adresse) + '&gt;</div>' +
		'<div><span class="lbl">À</span>' + A_QUI + '</div>';

	var onglets = document.getElementById('onglets');
	onglets.querySelector('[data-vue="html"]').disabled = !mail.html;
	onglets.querySelector('[data-vue="' + vue + '"]').classList.add('actif');
	onglets.querySelector('.info').textContent = mail.html ? 'multipart/alternative (HTML + texte)' : 'text/plain seulement';
	onglets.addEventListener('click', function (e) {
		var b = e.target.closest('button');
		if (b && !b.disabled) { aller('vue', b.getAttribute('data-vue')); }
	});

	var corps = document.getElementById('corps');
	if (vue === 'html') {
		var f = document.createElement('iframe');
		f.srcdoc = mail.html;
		f.onload = function () { f.style.height = f.contentDocument.documentElement.scrollHeight + 'px'; };
		corps.appendChild(f);
	} else {
		var pre = document.createElement('pre');
		pre.textContent = mail.texte;
		corps.appendChild(pre);
	}
	document.getElementById('apercu').textContent =
		'Objet : ' + mail.objet.length + ' caractères · texte brut : ' + mail.texte.length + ' caractères · ' +
		(mail.texte.match(/#cle=/g) || []).length + ' lien(s) de gestion · ' +
		((mail.texte.match(/\/@\/[a-z0-9-]+(?!#)(?=\s|$)/gm) || []).length) + ' lien(s) public(s) dans le texte';

	// ---------- barre de choix (hors maquette) ----------

	var cles = Object.keys(VARIANTES), iv = cles.indexOf(variante);
	var ic = CAS.findIndex(function (x) { return x[0] === casId; });
	var b = document.createElement('div');
	b.id = 'proto-barre';
	b.innerHTML = '<span class="marque">PROTOTYPE</span>' +
		'<button type="button" data-v="-1" title="Variante précédente (←)">◀</button>' +
		'<b>' + variante + ' (' + VARIANTES[variante][0] + ')</b>' +
		'<button type="button" data-v="1" title="Variante suivante (→)">▶</button>' +
		'<span class="sep"></span>' +
		'<button type="button" data-c="-1" title="Cas précédent (↑)">▲</button>' +
		'<select>' + CAS.map(function (x) { return '<option value="' + x[0] + '"' + (x[0] === casId ? ' selected' : '') + '>' + esc(x[1]) + '</option>'; }).join('') + '</select>' +
		'<button type="button" data-c="1" title="Cas suivant (↓)">▼</button>' +
		'<span class="sep"></span>' +
		'<button type="button" data-ecran title="Largeur (T)">' + (telephone ? '🖥 Ordinateur' : '📱 Téléphone') + '</button>';
	document.body.appendChild(b);
	function variant(d) { aller('variant', cles[(iv + d + cles.length) % cles.length]); }
	function etape(d) { aller('cas', CAS[(ic + d + CAS.length) % CAS.length][0]); }
	b.addEventListener('click', function (e) {
		var t = e.target.closest('button');
		if (!t) { return; }
		if (t.hasAttribute('data-v')) { variant(+t.getAttribute('data-v')); }
		if (t.hasAttribute('data-c')) { etape(+t.getAttribute('data-c')); }
		if (t.hasAttribute('data-ecran')) { aller('ecran', telephone ? 'ordinateur' : 'telephone'); }
	});
	b.querySelector('select').addEventListener('change', function () { aller('cas', this.value); });
	document.addEventListener('keydown', function (ev) {
		var t = ev.target;
		if (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) { return; }
		if (ev.key === 'ArrowLeft') { variant(-1); }
		if (ev.key === 'ArrowRight') { variant(1); }
		if (ev.key === 'ArrowUp') { ev.preventDefault(); etape(-1); }
		if (ev.key === 'ArrowDown') { ev.preventDefault(); etape(1); }
		if (ev.key === 't' || ev.key === 'T') { aller('ecran', telephone ? 'ordinateur' : 'telephone'); }
	});
})();
</script>
</body>
</html>
